    output_frequency: 1
    scheme: impes
    use_pseudo_pressure: false
    capillary_strength_factor: 1.0
    disable_capillary_effects: true
    disable_structural_dip: false
    miscibility_model: immiscible
    warn_well_anomalies: true
    normalize_saturations: false
    log_interval: 10
    freeze_saturation_pressure: false
    phase_appearance_tolerance: 1.0e-06
    pressure_solver: direct
    transport_solver: direct
    pressure_preconditioner: ilu
    transport_preconditioner: ilu
    pressure_convergence_tolerance: 1.0e-06
    transport_convergence_tolerance: 0.0001
    maximum_solver_iterations: 250
    use_nonlinear_pressure_solve: false
    cfl_threshold: 0.3
    maximum_newton_iterations: 10
    newton_tolerance: 1.0e-05
    maximum_line_search_cuts: 4
    saturation_jacobian_assembly_method: analytical
    maximum_newton_saturation_change: 0.2
    newton_stagnation_patience: 4
    newton_stagnation_improvement_threshold: 0.005
    maximum_pressure_change: 500.0
    maximum_oil_saturation_change: 0.6
    maximum_water_saturation_change: 0.6
    maximum_gas_saturation_change: 0.5
    maximum_picard_iterations: 5
    picard_tolerance: 0.001
    saturation_change_violation_tolerance: 0.05
    minimum_injector_gas_saturation: null
    minimum_injector_water_saturation: null
    enable_hysteresis: false
    residual_oil_drainage_ratio_water_flood: 0.6
    residual_oil_drainage_ratio_gas_flood: 0.6
    residual_gas_drainage_ratio: 0.5
    capture_timer_state: true
